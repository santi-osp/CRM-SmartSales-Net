AWSTemplateFormatVersion: '2010-09-09'
Description: 'SmartSales CRM - Data Stack: PostgreSQL 17 RDS Single-AZ en subredes privadas (ARCH-001 v1)'

Parameters:
  EnvironmentName:
    Type: String
    Default: smartsales-prod
    Description: Prefijo para nombres de recursos

  NetworkStackName:
    Type: String
    Default: smartsales-prod-network
    Description: Nombre del stack de red para importar subredes y security groups

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
      - db.t3.micro
      - db.t3.small
    Description: Clase de instancia RDS para el laboratorio

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Almacenamiento asignado en GiB (gp3)

  MasterUsername:
    Type: String
    Default: postgres
    Description: Usuario maestro administrativo para inicializar roles

  MasterUserPassword:
    Type: String
    NoEcho: true
    Description: Contrasena maestra administrativa de RDS (solo para bootstrap inicial)

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${EnvironmentName}-db-subnet-group'
      DBSubnetGroupDescription: 'Subredes privadas para PostgreSQL 17 SmartSales'
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnet1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnet2'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnet-group'

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: 'Parametros de seguridad y codificacion para PostgreSQL 17'
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-postgres'
      Engine: postgres
      EngineVersion: '17.2'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'Sun:04:30-Sun:05:30'
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref DBParameterGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-SecurityGroupRDS'
      MasterUsername: !Ref MasterUsername
      MasterUserPassword: !Ref MasterUserPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-postgres'
        - Key: Project
          Value: SmartSales

Outputs:
  DBEndpointAddress:
    Description: 'Host DNS del endpoint de PostgreSQL RDS'
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-DBEndpointAddress'

  DBEndpointPort:
    Description: 'Puerto del endpoint de PostgreSQL RDS'
    Value: !GetAtt RDSInstance.Endpoint.Port
    Export:
      Name: !Sub '${EnvironmentName}-DBEndpointPort'

  DBInstanceArn:
    Description: 'ARN de la instancia RDS'
    Value: !GetAtt RDSInstance.DBInstanceArn
    Export:
      Name: !Sub '${EnvironmentName}-DBInstanceArn'
