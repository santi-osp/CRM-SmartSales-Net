<div class="shell-layout" [class.sidebar-open]="isSidebarOpen()" (keydown.escape)="onEscape($event)">
  <!-- Backdrop móvil -->
  @if (isSidebarOpen()) {
    <button class="sidebar-backdrop" type="button" (click)="closeSidebar()" aria-label="Cerrar menú de navegación"></button>
  }

  <!-- Sidebar Lateral -->
  <aside class="sidebar" [attr.aria-label]="'Navegación del sistema'">
    <div class="sidebar-brand">
      <a routerLink="/dashboard" class="brand-link" (click)="closeSidebar()">
        <img src="smartsales-mark.svg" alt="" width="36" height="36" class="brand-logo" />
        <span class="brand-text">Smart<span class="brand-accent">Sales</span></span>
      </a>
      <button type="button" class="sidebar-close-btn" (click)="closeSidebar()" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menú principal">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/contacts" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Contactos</span>
      </a>

      <a routerLink="/opportunities" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>Oportunidades</span>
      </a>

      <a routerLink="/pipeline" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="11" y="3" width="5" height="12" rx="1"/><rect x="19" y="3" width="5" height="15" rx="1"/></svg>
        <span>Tablero Kanban</span>
      </a>

      <a routerLink="/agenda" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Agenda</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar-circle" [attr.aria-label]="user()?.displayName">{{ initials() }}</div>
        <div class="user-details">
          <span class="user-name" [title]="user()?.displayName">{{ user()?.displayName }}</span>
          <span class="role-badge">{{ roleLabel() }}</span>
        </div>
      </div>
      <button type="button" class="logout-btn" (click)="logout()" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Salir</span>
      </button>
    </div>
  </aside>

  <!-- Contenedor Principal con Topbar y Contenido -->
  <div class="main-wrapper">
    <header class="app-topbar">
      <div class="topbar-left">
        <button #mobileToggleBtn type="button" class="mobile-toggle-btn" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen()" aria-label="Abrir menú de navegación">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="breadcrumb">
          <span class="breadcrumb-app">SmartSales</span>
          <span class="breadcrumb-separator">/</span>
          <h2 class="breadcrumb-current">{{ currentTitle() }}</h2>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-chip">
          <span class="chip-dot"></span>
          Bogotá (UTC-5)
        </span>
        <div class="topbar-avatar" [title]="user()?.displayName">{{ initials() }}</div>
      </div>
    </header>

    <main id="main-content" class="content-body" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
