<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; fill: #ffffff; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94a3b8; }
    .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
    .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .metric-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #38bdf8; }
    .metric-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="120" r="140" fill="#2563eb" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#0284c7" opacity="0.2" filter="url(#glow)"/>
  <circle cx="650" cy="80" r="100" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Brand Tag -->
  <g transform="translate(80, 75)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#10b981"/>
    <text x="32" y="20" class="tag">ENTERPRISE CLOUD CRM</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="165" class="title" font-size="52" letter-spacing="-1">SmartSales CRM</text>
  <text x="80" y="210" class="subtitle" font-size="20">Arquitectura de Microservicios en .NET 10 &amp; Angular 22</text>
  <text x="80" y="238" class="subtitle" font-size="16" fill="#64748b">Despliegue Continuo Zero-Downtime Blue/Green en AWS ECS Fargate &amp; CodeDeploy</text>

  <!-- Badges / Pillars -->
  <g transform="translate(80, 280)">
    <!-- Badge 1: .NET 10 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="38" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#60a5fa"/>
      <text x="36" y="24" class="badge-text">.NET 10 Core</text>
    </g>

    <!-- Badge 2: Angular 22 -->
    <g transform="translate(142, 0)">
      <rect width="145" height="38" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#f87171"/>
      <text x="36" y="24" class="badge-text">Angular 22 SPA</text>
    </g>

    <!-- Badge 3: AWS Fargate -->
    <g transform="translate(299, 0)">
      <rect width="155" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#fbbf24"/>
      <text x="36" y="24" class="badge-text">AWS ECS Fargate</text>
    </g>

    <!-- Badge 4: Blue/Green -->
    <g transform="translate(466, 0)">
      <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#34d399"/>
      <text x="36" y="24" class="badge-text">Blue/Green CD</text>
    </g>

    <!-- Badge 5: PostgreSQL 17 -->
    <g transform="translate(648, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
      <text x="36" y="24" class="badge-text">Neon Postgres 17</text>
    </g>
  </g>

  <!-- Right Floating Metric Cards -->
  <g transform="translate(860, 60)" filter="url(#cardShadow)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="260" height="85" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="42" class="metric-value">100%</text>
      <text x="24" y="65" class="metric-label">ZERO-DOWNTIME ROLLOUT</text>
      <circle cx="225" cy="42" r="16" fill="#10b981" opacity="0.15"/>
      <path d="M219 42l4 4 8-8" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 100)">
      <rect width="260" height="85" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="42" class="metric-value">2 Microservices</text>
      <text x="24" y="65" class="metric-label">CONTACTS &amp; SALES AUTONOMOUS</text>
      <circle cx="225" cy="42" r="16" fill="#38bdf8" opacity="0.15"/>
      <rect x="219" y="36" width="12" height="12" rx="2" stroke="#38bdf8" stroke-width="2" fill="none"/>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 200)">
      <rect width="260" height="85" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="42" class="metric-value">JWT RS256</text>
      <text x="24" y="65" class="metric-label">ASYMMETRIC ENTERPRISE AUTH</text>
      <circle cx="225" cy="42" r="16" fill="#a855f7" opacity="0.15"/>
      <path d="M221 40v-2a4 4 0 018 0v2m-10 0h12v8h-12z" stroke="#c084fc" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
